[package]
name = "exameow-server"
version = "0.1.0"
edition = "2021"

[dependencies]
exameow-core = { path = "../core" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tempfile = "3"
