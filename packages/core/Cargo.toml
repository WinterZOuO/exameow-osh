[package]
name = "exambot-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
csv = "1"
lopdf = "0.34"
quick-xml = "0.37"
zip = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ring = "0.17"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
