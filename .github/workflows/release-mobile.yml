name: Release Mobile

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: Exameow
  PNPM_VERSION: '10'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Init Android project
        run: pnpm tauri android init

      - name: Build Android APK
        run: pnpm tauri android build --apk --target aarch64
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}

      - name: Generate self-signed keystore
        run: |
          keytool -genkey \
            -v \
            -keystore release.keystore \
            -alias exameow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass exameow \
            -keypass exameow \
            -dname "CN=Exameow"

      - name: Sign and align APK
        run: |
          mkdir -p dist
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          ALIGNED_APK="dist/Exameow-${{ github.ref_name }}-android_arm64.apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass exameow \
            -keypass exameow \
            "$UNSIGNED_APK" exameow
          "$BUILD_TOOLS/zipalign" -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  release:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: false
