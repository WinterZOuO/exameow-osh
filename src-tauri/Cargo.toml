[package]
name = "exambot"
version = "0.1.0"
edition = "2021"

[lib]
name = "exambot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
exambot-core = { path = "../packages/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
