# VPS 部署用：只 pull image，永遠唔喺 1c1g 上 compile
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: ${IMAGE:-ghcr.io/winterzouo/exameow-osh:latest}
    container_name: exameow-osh
    # 只 bind localhost，由 Caddy 反向代理出去，唔好直接曝露 3000 port
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - RUST_LOG=info
      - EXAM_DB_PATH=/app/data/exameow.db
      - ADMIN_TOKEN_FILE=/app/data/admin_token.txt
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN 必須設定，唔好用預設值 pass}
      # 過渡設定：W3（每用戶自己填 key）落地之後呢三個會拆走
      - AI_ENDPOINT=${AI_ENDPOINT:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
    volumes:
      - exameow-data:/app/data
    restart: unless-stopped

volumes:
  exameow-data:
