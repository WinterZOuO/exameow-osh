# VPS 部署用：只 pull image，永遠唔喺 1c1g 上 compile
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: ${IMAGE:-ghcr.io/winterzouo/exameow-osh:latest}
    container_name: exameow-osh
    # 只 bind localhost，由 Caddy 反向代理出去，唔好直接曝露 3000 port
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - RUST_LOG=info
      - EXAM_DB_PATH=/app/data/exameow.db
      - ADMIN_TOKEN_FILE=/app/data/admin_token.txt
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN 必須設定，唔好用預設值 pass}
      # 加密每個用戶 LLM API key 嘅 master key（W3）。
      # 生成：openssl rand -hex 32
      # 唔好 commit 入 git，備份時亦唔好同 exameow-data volume 擺埋一齊 ——
      # 分開放，DB 單獨洩漏先解唔開啲 key。
      # 一旦遺失，所有已存嘅 API key 都救唔返（用戶重新填就得）。
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY 必須設定，用 openssl rand -hex 32 生成}
      # 選填：server 自己一套 fallback key，用戶冇填自己嗰條就用呢個
      - AI_ENDPOINT=${AI_ENDPOINT:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      # 選填：allowlist 以外嘅 LLM host（自架 / 內網），逗號分隔
      - LLM_EXTRA_HOSTS=${LLM_EXTRA_HOSTS:-}
    volumes:
      - exameow-data:/app/data
    restart: unless-stopped

volumes:
  exameow-data:
